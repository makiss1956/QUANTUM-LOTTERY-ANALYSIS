# Quantum Lottery Analysis V2 — Ρυθμίσεις
# (τα email στοιχεία ΔΕΝ μπαίνουν εδώ — μόνο στο αρχείο .env)

quantum:
  decay_lambda: 0.0012        # αποσύνθεση πλάσης ανά κλήρωση (half-life ≈ 577 κληρώσεις)
  ent_window: 0.0025          # αποσύνθεση μήτρας διεμπλοκής (half-life ≈ 277)
  w_interference: 1.0         # βάρος όρου αλληλεπίδρασης (κύμα-σωματίδιο, διπλή σχισμή)
  w_entanglement: 0.35        # βάρος όρου διεμπλοκής (συ-εμφανίσεις ζευγών)
  w_tunneling: 0.06           # ώθηση «κβαντικής διόδευσης» για υπερ-αλυχισμένους αριθμούς
  alt_tickets: 2              # εναλλακτικά κλαδιά 5+2 (2ο & 3ο σύμπαν)
  min_branch_distance: 2      # ελάχιστη διαφορά εναλλακτικών από Σκελετό Α

backtest:
  depth: 0                    # 0 = όλο το ιστορικό
  warmup_draws: 300           # ελάχιστο ιστορικό πριν την πρώτη αξιολόγηση

timezone: Europe/Athens
