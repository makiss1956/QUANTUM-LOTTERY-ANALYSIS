# ─────────────────────────────────────────────────────────────────────────────
# 🛠️ Χειροκίνητη Εκτέλεση — τρέχει όποια εντολή θέλεις, όποτε θέλεις
#
# Πώς: tab «Actions» → «🛠️ Χειροκίνητη Εκτέλεση» → «Run workflow»
#      → διάλεξε εντολή από τη λίστα → «Run workflow»
# ─────────────────────────────────────────────────────────────────────────────
name: "🛠️ Χειροκίνητη Εκτέλεση"

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Ποια εντολή να τρέξει;"
        type: choice
        required: true
        default: "status"
        options:
          - status        # σύντομη εικόνα κατάστασης
          - fetch         # ενημέρωση ιστορικού από τις πηγές
          - predict       # νέα πρόβλεψη (αποθήκευση + email)
          - compare       # σύγκριση εκκρεμών προβλέψεων
          - auto          # πλήρης κύκλος fetch→compare→predict→email
          - backtest      # walk-forward αξιολόγηση όλου του ιστορικού (~10 λεπτά)
          - report        # συσσωρευμένα στατιστικά (νίκες, συμμετοχές)
          - test-email    # δοκιμαστική αποστολή email
      send_email:
        description: "Αποστολή email (για predict/compare/auto)"
        type: boolean
        required: false
        default: false

concurrency:
  group: quantum-lottery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Λήψη του repo
        uses: actions/checkout@v4

      - name: 🐍 Εγκατάσταση Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Εγκατάσταση εξαρτήσεων
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "▶️ Εκτέλεση εντολής: ${{ inputs.command }}"
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          CMD="${{ inputs.command }}"
          case "$CMD" in
            predict|compare|auto)
              if [ "${{ inputs.send_email }}" = "true" ]; then
                python quantum_lottery.py "$CMD"
              else
                python quantum_lottery.py "$CMD" --no-email
              fi
              ;;
            *)
              python quantum_lottery.py "$CMD"
              ;;
          esac

      - name: 💾 Καταχώριση αποτελεσμάτων στο repo
        if: always()
        run: |
          git config user.name  "quantum-lottery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git add -A logs || true
          if git diff --cached --quiet; then
            echo "Καμία αλλαγή — δεν χρειάζεται commit."
          else
            git commit -m "🤖 manual (${{ inputs.command }}): ενημέρωση αποτελεσμάτων [skip ci]"
            git push
          fi

      - name: 📎 Ανέβασμα αναφορών ως artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-${{ inputs.command }}
          path: |
            reports/
            logs/
          retention-days: 90
          if-no-files-found: ignore
