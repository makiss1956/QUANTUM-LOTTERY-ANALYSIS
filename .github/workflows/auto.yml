# ─────────────────────────────────────────────────────────────────────────────
# 🔮 Quantum Auto — πλήρες αυτόματο κύκλωμα
# Τρέχει ΑΥΤΟΜΑΤΑ κάθε Τρίτη & Παρασκευή στις 21:30 UTC (23:30 ώρα Ελλάδας
# χειμώνα / 00:30 θερινή ώρα), δηλαδή ΜΕΤΑ την ανακοίνωση της κλήρωσης.
#
# Κύκλος:  fetch (νέα κλήρωση) → compare (προηγούμενη πρόβλεψη)
#          → predict (νέα πρόβλεψη) → email → αποθήκευση όλων στο repo
#
# Τα αποτελέσματα (ιστορικό προβλέψεων, συγκρίσεις, HTML, logs) ΚΑΤΑΧΩΡΟΥΝΤΑΙ
# στο ίδιο το repo, ώστε τίποτα να μη χάνεται ανάμεσα στις εκτελέσεις.
# ─────────────────────────────────────────────────────────────────────────────
name: "🔮 Quantum Auto (Τρίτη & Παρασκευή)"

on:
  schedule:
    # 21:30 UTC κάθε Τρίτη (2) & Παρασκευή (5) — cron είναι πάντα σε UTC
    - cron: "30 21 * * 2,5"
  # Επιτρέπει και χειροκίνητη εκτέλεση από το tab "Actions"
  workflow_dispatch:

# Δύο εκτελέσεις δεν πρέπει να τρέχουν ταυτόχρονα
concurrency:
  group: quantum-lottery
  cancel-in-progress: false

# Δικαίωμα στο GITHUB_TOKEN να κάνει commit πίσω στο repo
permissions:
  contents: write

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Λήψη του repo
        uses: actions/checkout@v4

      - name: 🐍 Εγκατάσταση Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Εγκατάσταση εξαρτήσεων
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔮 Πλήρης κύκλος (fetch → compare → predict → email)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_TO_PARTNER: ${{ secrets.EMAIL_TO_PARTNER }}
        run: python quantum_lottery.py auto

      - name: 💾 Καταχώριση αποτελεσμάτων στο repo
        run: |
          git config user.name  "quantum-lottery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git add -A logs || true
          if git diff --cached --quiet; then
            echo "Καμία αλλαγή — δεν χρειάζεται commit."
          else
            git commit -m "🤖 auto: ενημέρωση προβλέψεων & συγκρίσεων [skip ci]"
            git push
          fi

      - name: 📎 Ανέβασμα αναφορών ως artifacts (90 ημέρες)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/
            logs/
          retention-days: 90
          if-no-files-found: ignore
