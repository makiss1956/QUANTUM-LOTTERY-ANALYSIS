# ─────────────────────────────────────────────────────────────────────────────
# 🧪 Tests — αυτόματα τεστ σε ΚΑΘΕ αλλαγή του κώδικα (push)
# Τα 13 unit tests του φακέλου tests/ επαληθεύουν ότι το μοντέλο δουλεύει σωστά.
# ─────────────────────────────────────────────────────────────────────────────
name: "🧪 Tests"

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Λήψη του repo
        uses: actions/checkout@v4

      - name: 🐍 Εγκατάσταση Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Εγκατάσταση εξαρτήσεων
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: 🧪 Εκτέλεση unit tests
        run: python -m pytest tests/ -v
